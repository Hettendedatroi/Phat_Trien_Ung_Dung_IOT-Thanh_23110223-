services:
  broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - mosq_data:/mosquitto/data

  dashboard:
    build: ./dashboard
    container_name: mqtt-dashboard
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "8080:8080"
    environment:
      MQTT_HOST: broker
      MQTT_USER: nhom01
      MQTT_PASS: ${MQTT_PASS:?Hay dat MQTT_PASS trong file .env}
      DASH_USER: ${DASH_USER:-admin}
      DASH_PASS: ${DASH_PASS:-}
      DASH_READONLY: ${DASH_READONLY:-0}

volumes:
  mosq_data:
